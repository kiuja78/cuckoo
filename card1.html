</style></head><body><main class="wrap"><section class="canvas cards"><img src="assets/sian1.png" alt="쿠쿠홈시스 부산 김건일 팀장 디지털 명함"><div class="logoMask"></div><div class="logoBlock"><div class="cuckoo">CUCKOO</div><div class="brandText">쿠쿠홈시스 부산</div></div><div class="infoMask"></div><div class="infoOverlay"><div class="line">정수기 · 비데 · 공기청정기 ·<br>안마의자 · 매트리스</div><div class="line">구독 · 렌탈 · 교체상담</div><div class="promise">고객님께 최상의 컨설팅을 약속드립니다.</div></div><div class="replaceProduct"><span class="icon">◉</span><span>안마의자<br>상담</span></div><button class="hotspot call" data-action="call" aria-label="전화 상담하기"></button><button class="hotspot sms" data-action="sms" aria-label="문자 상담하기"></button><button class="hotspot kakao" data-action="kakao" aria-label="카카오톡 상담하기"></button><button class="hotspot water" data-product="정수기" aria-label="정수기 상담"></button><button class="hotspot bidet" data-product="비데" aria-label="비데 상담"></button><button class="hotspot air" data-product="공기청정기" aria-label="공기청정기 상담"></button><button class="hotspot chair" data-product="안마의자" aria-label="안마의자 상담"></button><button class="hotspot mattress" data-product="매트리스" aria-label="매트리스 상담"></button><button class="hotspot etc" data-product="기타 제품" aria-label="기타 제품 상담"></button><button class="hotspot benefit1" data-product="신규 렌탈" aria-label="신규 렌탈 제품 안내"></button><button class="hotspot benefit2" data-product="만기 고객 교체" aria-label="만기 고객 교체 혜택 안내"></button><button class="hotspot benefit3" data-product="멤버십 가입" aria-label="멤버십 가입 혜택"></button><button class="hotspot benefit4" data-product="리퍼브 특가" aria-label="리퍼브 특가 제품 상담"></button><button class="hotspot benefit5" data-product="소상공인 맞춤" aria-label="소상공인 맞춤 상담"></button><button class="hotspot save" data-action="save" aria-label="연락처 저장하기"></button><button class="hotspot home" data-action="home" aria-label="홈페이지 보기"></button></section></main><div class="sheet" id="sheet"><h3 id="sheetTitle">상담 연결</h3><p id="sheetDesc">원하시는 버튼을 선택해 주세요.</p><div id="sheetLinks"></div><button class="cancel" id="closeSheet">닫기</button></div><script>
const TEL1="01083461500",TEL2="01083437150";
const sheet=document.getElementById("sheet"),sheetTitle=document.getElementById("sheetTitle"),sheetDesc=document.getElementById("sheetDesc"),sheetLinks=document.getElementById("sheetLinks");
function smsHref(num,body){const encoded=encodeURIComponent(body);const sep=/iPhone|iPad|iPod/i.test(navigator.userAgent)?"&":"?";return `sms:${num}${sep}body=${encoded}`}
function openSheet(title,desc,links){sheetTitle.textContent=title;sheetDesc.textContent=desc||"";sheetLinks.innerHTML=links.map(l=>`<a class="${l.className||""}" href="${l.href}" ${l.target?'target="_blank" rel="noopener"':''}>${l.label}</a>`).join("");sheet.classList.add("open")}
document.getElementById("closeSheet").onclick=()=>sheet.classList.remove("open");
function saveContact(){
  if(/Android/i.test(navigator.userAgent)){
    const name=encodeURIComponent("쿠쿠 렌탈 김건일 팀장");
    const company=encodeURIComponent("쿠쿠홈시스 부산(CUCKOO)");
    location.href=`intent://insert#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;S.name=${name};S.phone=${TEL1};S.secondary_phone=${TEL2};S.company=${company};S.job_title=팀장;end`;
    setTimeout(()=>{location.href="cuckoo_kimgeonil.vcf"},1800);
  } else { location.href="cuckoo_kimgeonil.vcf"; }
}
document.addEventListener("click",e=>{const action=e.target.dataset.action;const product=e.target.dataset.product;if(action==="call")openSheet("전화상담 연결","원하시는 연결 버튼을 선택해 주세요.",[{label:"전화상담연결1",href:`tel:${TEL1}`},{label:"전화상담연결2",href:`tel:${TEL2}`}]);if(action==="sms")openSheet("문자상담 요청","원하시는 요청 버튼을 선택해 주세요.",[{label:"문자상담요청1",href:smsHref(TEL1,"쿠쿠 제품 상담 문의드립니다.")},{label:"문자상담요청2",href:smsHref(TEL2,"쿠쿠 제품 상담 문의드립니다.")}]);if(action==="kakao")openSheet("카카오톡 상담","카카오채널 심사 완료 전까지 문자상담으로 우선 연결됩니다.",[{label:"문자상담요청1",href:smsHref(TEL1,"카카오톡 상담 문의드립니다. 쿠쿠 제품 상담 안내 부탁드립니다.")},{label:"문자상담요청2",href:smsHref(TEL2,"카카오톡 상담 문의드립니다. 쿠쿠 제품 상담 안내 부탁드립니다.")}]);if(action==="save")saveContact();if(action==="home")window.open("https://github.com/kiuja78/cuckoo","_blank","noopener");if(product){const body=`${product} 상담 문의드립니다. 쿠쿠 렌탈 김건일 팀장님 안내 부탁드립니다.`;openSheet(`${product} 상담`,"상담 문구가 자동 입력됩니다.",[{label:"문자상담요청1",href:smsHref(TEL1,body)},{label:"문자상담요청2",href:smsHref(TEL2,body)}])}});
</script></body></html>
