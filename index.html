<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>쿠쿠 렌탈 김건일 팀장 디지털 명함</title>
<style>
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; background:#f6f0e7; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Pretendard",sans-serif; }
  body { min-height:100svh; display:flex; justify-content:center; }
  .page { width:min(100vw,430px); min-height:100svh; background:#f6f0e7; }
  .card-wrap { position:relative; width:100%; max-width:430px; margin:0 auto; overflow:hidden; }
  .card-img { display:block; width:100%; height:auto; user-select:none; -webkit-user-select:none; pointer-events:none; }
  .hotspot { position:absolute; display:block; border:0; background:rgba(255,255,255,0); cursor:pointer; padding:0; margin:0; text-indent:-9999px; overflow:hidden; touch-action:manipulation; -webkit-tap-highlight-color:rgba(99,119,89,0.18); }
  .hotspot:active { background:rgba(99,119,89,0.1); }
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.38); opacity:0; pointer-events:none; transition:opacity .18s ease; z-index:1000; }
  .sheet-bg.open { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:50%; bottom:0; transform:translate(-50%,110%); width:min(100vw,430px); background:#fffaf1; border-radius:24px 24px 0 0; box-shadow:0 -16px 42px rgba(0,0,0,.25); padding:20px 16px calc(20px + env(safe-area-inset-bottom)); transition:transform .22s ease; z-index:1001; color:#263022; }
  .sheet.open { transform:translate(-50%,0); }
  .sheet h3 { margin:0 0 8px; font-size:21px; line-height:1.25; letter-spacing:-0.6px; }
  .sheet p { margin:0 0 14px; font-size:14px; color:#66745d; line-height:1.45; }
  .sheet-links { display:grid; gap:10px; }
  .sheet-links a, .sheet-close { min-height:56px; border-radius:16px; border:0; text-decoration:none; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; color:#fff; background:#637759; }
  .sheet-close { width:100%; margin-top:10px; color:#263022; background:#eee8dc; }
</style>
</head>
<body>
<main class="page">
  <section class="card-wrap" aria-label="쿠쿠 렌탈 김건일 팀장 디지털 명함">
    <img class="card-img" src="assets/card_latest.png" alt="쿠쿠 렌탈 김건일 팀장 디지털 명함" />
    <div id="hotspots"></div>
  </section>
</main>
<div id="sheetBg" class="sheet-bg"></div>
<section id="sheet" class="sheet" aria-modal="true" role="dialog">
  <h3 id="sheetTitle">상담 연결</h3>
  <p id="sheetDesc">원하시는 연결 방식을 선택해 주세요.</p>
  <div id="sheetLinks" class="sheet-links"></div>
  <button id="sheetClose" class="sheet-close" type="button">닫기</button>
</section>
<script>
const IMG_W = 941;
const IMG_H = 1672;
const TEL1 = '01083461500';
const TEL2 = '01083437150';
const KAKAO = 'https://pf.kakao.com/_zzxebX/friend';
const HOME = 'https://github.com/kiuja78/cuckoo';
const hotspots = [{"name": "전화 상담하기", "action": "call", "x": 32, "y": 733, "w": 289, "h": 102}, {"name": "문자 상담하기", "action": "sms", "x": 336, "y": 733, "w": 273, "h": 102}, {"name": "카카오톡 상담하기", "action": "kakao", "x": 626, "y": 733, "w": 305, "h": 102}, {"name": "정수기 상담", "action": "product", "product": "정수기", "x": 48, "y": 958, "w": 285, "h": 145}, {"name": "비데 상담", "action": "product", "product": "비데", "x": 346, "y": 958, "w": 269, "h": 145}, {"name": "공기청정기 상담", "action": "product", "product": "공기청정기", "x": 628, "y": 958, "w": 272, "h": 145}, {"name": "안마의자 상담", "action": "product", "product": "안마의자", "x": 48, "y": 1114, "w": 285, "h": 148}, {"name": "매트리스 상담", "action": "product", "product": "매트리스", "x": 346, "y": 1114, "w": 269, "h": 148}, {"name": "기타 제품 상담", "action": "product", "product": "기타 제품", "x": 628, "y": 1114, "w": 272, "h": 148}, {"name": "연락처 저장하기", "action": "save", "x": 27, "y": 1521, "w": 418, "h": 104}, {"name": "홈페이지 보기", "action": "home", "x": 469, "y": 1521, "w": 435, "h": 104}];
function pct(v,t) { return (v/t*100).toFixed(5)+'%'; }
function smsHref(num, body) {
  const encoded = encodeURIComponent(body);
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
  return `sms:${num}${isIOS ? '&' : '?'}body=${encoded}`;
}
function showSheet(title, desc, links) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetDesc').textContent = desc || '원하시는 연결 방식을 선택해 주세요.';
  const box = document.getElementById('sheetLinks');
  box.innerHTML = '';
  links.forEach(item => {
    const a = document.createElement('a');
    a.textContent = item.label;
    a.href = item.href;
    if (item.target) { a.target = '_blank'; a.rel = 'noopener'; }
    box.appendChild(a);
  });
  document.getElementById('sheetBg').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet() {
  document.getElementById('sheetBg').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
function saveContact() {
  const isAndroid = /Android/i.test(navigator.userAgent || '');
  if (isAndroid) {
    const intentUrl = 'intent://contacts/create#Intent;'+
      'action=android.intent.action.INSERT;'+
      'type=vnd.android.cursor.dir/contact;'+
      'S.name=쿠쿠 렌탈 김건일 팀장;'+
      'S.phone=01083461500;'+
      'S.secondary_phone=01083437150;'+
      'S.company=쿠쿠홈시스 부산(CUCKOO);'+
      'end';
    window.location.href = intentUrl;
    setTimeout(() => { window.location.href = 'cuckoo_kimgeonil.vcf'; }, 1200);
  } else {
    window.location.href = 'cuckoo_kimgeonil.vcf';
  }
}
function handleAction(item) {
  if (item.action === 'call') {
    showSheet('전화 상담 연결', '전화번호는 화면에 노출하지 않고 선택 버튼으로 연결합니다.', [
      {label:'전화상담연결1', href:`tel:${TEL1}`},
      {label:'전화상담연결2', href:`tel:${TEL2}`}
    ]);
    return;
  }
  if (item.action === 'sms') {
    const body = '쿠쿠 제품 상담 문의드립니다.';
    showSheet('문자 상담 요청', '문자 상담을 원하시는 연결 버튼을 선택해 주세요.', [
      {label:'문자상담요청1', href:smsHref(TEL1, body)},
      {label:'문자상담요청2', href:smsHref(TEL2, body)}
    ]);
    return;
  }
  if (item.action === 'kakao') {
    window.location.href = KAKAO;
    return;
  }
  if (item.action === 'product') {
    const product = item.product || '제품';
    const body = `${product} 상담 문의드립니다. 쿠쿠 렌탈 김건일 팀장님 안내 부탁드립니다.`;
    showSheet(`${product} 상담`, '상담 요청을 보낼 번호를 선택해 주세요.', [
      {label:'문자상담요청1', href:smsHref(TEL1, body)},
      {label:'문자상담요청2', href:smsHref(TEL2, body)}
    ]);
    return;
  }
  if (item.action === 'save') { saveContact(); return; }
  if (item.action === 'home') { window.open(HOME, '_blank', 'noopener'); return; }
}
function renderHotspots() {
  const root = document.getElementById('hotspots');
  hotspots.forEach(item => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'hotspot';
    btn.setAttribute('aria-label', item.name);
    btn.style.left = pct(item.x, IMG_W);
    btn.style.top = pct(item.y, IMG_H);
    btn.style.width = pct(item.w, IMG_W);
    btn.style.height = pct(item.h, IMG_H);
    btn.addEventListener('click', () => handleAction(item));
    root.appendChild(btn);
  });
}
document.addEventListener('DOMContentLoaded', () => {
  renderHotspots();
  document.getElementById('sheetBg').addEventListener('click', closeSheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
});
</script>
</body>
</html>
