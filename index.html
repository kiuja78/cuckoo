<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쿠쿠홈시스 부산(CUCKOO) | 쿠쿠 렌탈 김건일 팀장</title>
<meta name="description" content="쿠쿠홈시스 부산(CUCKOO) 쿠쿠 렌탈 김건일 팀장 디지털 명함">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}body{display:flex;justify-content:center}.wrap{width:min(100vw,520px);min-height:100svh;background:#f5efe7;position:relative}.tabs{position:fixed;left:50%;top:10px;transform:translateX(-50%);width:min(calc(100vw - 18px),500px);z-index:30;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:rgba(255,255,255,.8);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.55);border-radius:999px;box-shadow:0 8px 26px rgba(0,0,0,.16)}.tabs button{border:0;border-radius:999px;padding:9px 4px;font-weight:800;font-size:13px;color:#334;background:transparent}.tabs button.active{background:#63775d;color:#fff}.screen{display:none;width:100%;position:relative}.screen.active{display:block}.canvas{position:relative;width:100%;line-height:0}.canvas img{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;pointer-events:none}.hotspot{position:absolute;z-index:5;display:block;border:0;background:rgba(255,255,255,0);cursor:pointer;border-radius:14px}.hotspot:active{background:rgba(0,140,255,.12)}.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(100vw,520px);z-index:80;background:rgba(255,255,255,.96);border-radius:24px 24px 0 0;box-shadow:0 -18px 44px rgba(0,0,0,.25);padding:18px;transition:.22s ease;color:#182018}.sheet.open{transform:translate(-50%,0)}.sheet h3{margin:0 0 10px;font-size:20px;letter-spacing:-.6px}.sheet p{margin:0 0 12px;color:#596258;font-size:14px;line-height:1.45}.sheet a,.sheet button{width:100%;min-height:54px;margin-top:9px;border-radius:15px;border:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#63775d;color:#fff;font-size:16px;font-weight:900;text-decoration:none}.sheet .kakao{background:#f6cf42;color:#251f00}.sheet .cancel{background:#e8e8e8;color:#333}.call{left:15%;top:44.2%;width:25%;height:5.8%}.sms{left:41%;top:44.2%;width:25%;height:5.8%}.kakaoBtn{left:67%;top:44.2%;width:25%;height:5.8%}.water{left:15%;top:55.0%;width:21%;height:5.6%}.bidet{left:39%;top:55.0%;width:21%;height:5.6%}.air{left:63%;top:55.0%;width:23%;height:5.6%}.induction{left:15%;top:62.0%;width:21%;height:5.6%}.mattress{left:39%;top:62.0%;width:21%;height:5.6%}.etc{left:63%;top:62.0%;width:23%;height:5.6%}.benefit1{left:16%;top:73.0%;width:68%;height:4.0%}.benefit2{left:16%;top:77.2%;width:68%;height:4.0%}.benefit3{left:16%;top:81.4%;width:68%;height:4.0%}.benefit4{left:16%;top:85.6%;width:68%;height:4.0%}.benefit5{left:16%;top:89.8%;width:68%;height:4.0%}.save{left:14%;top:92.5%;width:38%;height:5.2%}.home{left:56%;top:92.5%;width:35%;height:5.2%}.screen.cards .benefit1{left:16%;top:75.0%;width:34%;height:8.8%}.screen.cards .benefit2{left:16%;top:83.8%;width:34%;height:4.0%}.screen.cards .benefit3{left:16%;top:87.6%;width:34%;height:4.0%}.screen.cards .benefit4{left:55%;top:75.0%;width:34%;height:8.8%}.screen.cards .benefit5{left:55%;top:83.8%;width:34%;height:7.8%}.screen.dark .call,.screen.dark .sms,.screen.dark .kakaoBtn{top:43.0%}.screen.dark .water,.screen.dark .bidet,.screen.dark .air,.screen.dark .induction,.screen.dark .mattress,.screen.dark .etc{top:56.0%;height:7.0%}.screen.dark .water{left:14%;width:13%}.screen.dark .bidet{left:28%;width:13%}.screen.dark .air{left:42%;width:13%}.screen.dark .induction{left:56%;width:13%}.screen.dark .mattress{left:70%;width:13%}.screen.dark .etc{left:84%;width:13%}.screen.dark .benefit1{left:14%;top:73.8%;width:39%;height:5.0%}.screen.dark .benefit2{left:14%;top:79.0%;width:39%;height:5.0%}.screen.dark .benefit3{left:14%;top:84.2%;width:39%;height:5.0%}.screen.dark .benefit4{left:55%;top:73.8%;width:39%;height:7.8%}.screen.dark .benefit5{left:55%;top:81.6%;width:39%;height:7.8%}.screen.dark .save{left:13%;top:91.5%;width:40%}.screen.dark .home{left:55%;top:91.5%;width:38%}
</style>
</head>
<body>
<main class="wrap">
<nav class="tabs"><button class="active" data-target="sian1">시안 1</button><button data-target="sian2">시안 2</button><button data-target="sian3">시안 3</button></nav>
<section id="sian1" class="screen active"><div class="canvas"><img src="assets/sian1.png" alt="시안 1"></div></section>
<section id="sian2" class="screen cards"><div class="canvas"><img src="assets/sian2.png" alt="시안 2"></div></section>
<section id="sian3" class="screen dark"><div class="canvas"><img src="assets/sian3.png" alt="시안 3"></div></section>
</main>
<div class="sheet" id="sheet"><h3 id="sheetTitle">상담 연결</h3><p id="sheetDesc">원하시는 번호를 선택해 주세요.</p><div id="sheetLinks"></div><button class="cancel" id="closeSheet">닫기</button></div>
<script>
const TEL1="01083461500",TEL2="01083437150",DISPLAY1="010-8346-1500",DISPLAY2="010-8343-7150",KAKAO="https://pf.kakao.com/_zzxebX/friend";
const hotspot=`<button class="hotspot call" data-action="call"></button><button class="hotspot sms" data-action="sms"></button><button class="hotspot kakaoBtn" data-action="kakao"></button><button class="hotspot water" data-product="정수기"></button><button class="hotspot bidet" data-product="비데"></button><button class="hotspot air" data-product="공기청정기"></button><button class="hotspot induction" data-product="인덕션"></button><button class="hotspot mattress" data-product="매트리스"></button><button class="hotspot etc" data-product="기타 제품"></button><button class="hotspot benefit1" data-product="신규 렌탈"></button><button class="hotspot benefit2" data-product="만기 고객 교체"></button><button class="hotspot benefit3" data-product="멤버십 가입"></button><button class="hotspot benefit4" data-product="리퍼브 특가"></button><button class="hotspot benefit5" data-product="소상공인 맞춤"></button><button class="hotspot save" data-action="save"></button><button class="hotspot home" data-action="home"></button>`;
document.querySelectorAll('.canvas').forEach(c=>c.insertAdjacentHTML('beforeend',hotspot));
const sheet=document.getElementById('sheet'),title=document.getElementById('sheetTitle'),desc=document.getElementById('sheetDesc'),links=document.getElementById('sheetLinks');
function smsHref(num,body){const sep=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'&':'?';return `sms:${num}${sep}body=${encodeURIComponent(body)}`}
function openSheet(t,d,arr){title.textContent=t;desc.textContent=d||'';links.innerHTML=arr.map(l=>`<a class="${l.className||''}" href="${l.href}" ${l.target?'target="_blank" rel="noopener"':''}>${l.label}</a>`).join('');sheet.classList.add('open')}
document.getElementById('closeSheet').onclick=()=>sheet.classList.remove('open');
document.addEventListener('click',e=>{const a=e.target.dataset.action,p=e.target.dataset.product;if(a==='call')openSheet('전화 상담 번호 선택','연결할 번호를 선택해 주세요.',[{label:`대표번호 ${DISPLAY1}`,href:`tel:${TEL1}`},{label:`보조번호 ${DISPLAY2}`,href:`tel:${TEL2}`}]);if(a==='sms'){const b='쿠쿠 제품 상담 문의드립니다.';openSheet('문자 상담 번호 선택','문자를 보낼 번호를 선택해 주세요.',[{label:`대표번호로 문자 ${DISPLAY1}`,href:smsHref(TEL1,b)},{label:`보조번호로 문자 ${DISPLAY2}`,href:smsHref(TEL2,b)}])}if(a==='kakao'){const b='카카오톡 상담 문의드립니다. 쿠쿠 제품 상담 안내 부탁드립니다.';openSheet('카카오톡 상담','카카오채널 심사 완료 전까지 문자 상담으로 우선 연결됩니다.',[{label:`문자 상담으로 연결 ${DISPLAY1}`,href:smsHref(TEL1,b)},{label:`문자 상담으로 연결 ${DISPLAY2}`,href:smsHref(TEL2,b)},{label:'카카오톡 채널 열기',href:KAKAO,target:true,className:'kakao'}])}if(a==='save')location.href='cuckoo_kimgeonil.vcf';if(a==='home')window.open('https://github.com/kiuja78/cuckoo','_blank','noopener');if(p){const b=`${p} 상담 문의드립니다. 쿠쿠홈시스 부산 김건일 팀장님 안내 부탁드립니다.`;openSheet(`${p} 상담`,'상담 문구가 자동 입력됩니다. 보낼 번호를 선택해 주세요.',[{label:`대표번호로 문자 ${DISPLAY1}`,href:smsHref(TEL1,b)},{label:`보조번호로 문자 ${DISPLAY2}`,href:smsHref(TEL2,b)}])}});
document.querySelectorAll('.tabs button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.target).classList.add('active');scrollTo({top:0,behavior:'smooth'})});
</script>
</body></html>
